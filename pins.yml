---
# Keep mandatory migration checkpoints visible and constrain NS8 upgrade offers.
# NS8 core 2.10+ reads org.nethserver.min-from from repository metadata.
erpnext:
  - { tag: "4.2.0", prepend: false, required: true }
  - { tag: "5.0.0", prepend: false, required: true }
  - { match: ">4.2.0", min_from: "4.2.0" }
  - { match: ">5.0.0", min_from: "5.0.0" }
